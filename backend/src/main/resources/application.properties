spring.config.import=optional:file:.env.properties
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=21

server.port=8080

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000

spring.web.resources.static-locations=classpath:/static/,file:uploads/

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Password for the first admin account (created only when none exists).
# Never commit a real value - set ADMIN_BOOTSTRAP_PASSWORD in the environment.
admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}

logging.level.org.springframework.mail=WARN
logging.level.org.springframework.mail.javamail=WARN
logging.level.org.springframework.security=INFO

github.api-url=https://api.github.com
github.api-version=2022-11-28
github.access-token=${GITHUB_ACCESS_TOKEN}
github.organization=braintrain-sandbox

razorpay.key-id=${RAZORPAY_API_KEY}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}

# Hibernate must only VALIDATE the Flyway-managed schema, never alter it.
server.address=127.0.0.1
