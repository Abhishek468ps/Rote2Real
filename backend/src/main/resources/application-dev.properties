# Local DEVELOPMENT profile (activate with SPRING_PROFILES_ACTIVE=dev).
# Uses a throw-away local PostgreSQL database. No real secrets live in this file:
# DATABASE_PASSWORD, RAZORPAY_API_KEY and RAZORPAY_KEY_SECRET still come from environment variables.

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/rote2real}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}

# The numbered Flyway migrations (V22+) assume the team's existing database (baseline V21),
# so on a fresh local database Hibernate builds the schema from the entities instead.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

# Seed the 20 Rote2Real exercises (re-runs just log a harmless duplicate error).
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.data-locations=classpath:db/migration/V48__seed_rote2real_exercises.sql

# Dummy values so the app can start locally (OTP / GitHub features will not work with these).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:dev}
spring.mail.password=${MAIL_PASSWORD:dev}
github.access-token=${GITHUB_ACCESS_TOKEN:dev-not-used}
jwt.secret=${JWT_SECRET:LocalDevOnlyJwtSecret_ChangeMe_0123456789abcdef}

# Local-only bootstrap password for the first admin account.
# The production/default profile has NO default value.
admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:Admin@123}
